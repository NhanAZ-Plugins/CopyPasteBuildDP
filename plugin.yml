commands:
  cp:
    description: Save and paste a bounded region
    permission: cp

permissions:
  cp:
    default: op
    description: Use CopyPasteBuildDP
  cp.save:
    default: op
    description: Save a selected region
  cp.paste:
    default: op
    description: Paste a saved region